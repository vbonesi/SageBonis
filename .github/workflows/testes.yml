name: testes

# A suíte roda em todo push/PR: um job rápido (só Python) e um com LibreOffice real
# para o round-trip de import/export.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rapidos:
    name: Smoke test + sincronia (sem LibreOffice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compila a macro e a ferramenta de sync
        run: python -m py_compile ImportadorSAGE.py sync_macro.py

      # O .ods tem sua própria cópia da macro; editar o .py e esquecer de injetar
      # deixava as duas versões divergentes até alguém rodar o status na mão.
      - name: Macro embutida em sincronia com o .py
        run: python sync_macro.py status

      - name: Smoke test do parser
        run: python tests/run_all.py --sem-uno

  uno:
    name: Round-trip import/export (LibreOffice real)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # O módulo 'uno' vem do pacote python3-uno; rodar a macro EMBUTIDA no .ods
      # (location=document) exige ainda o provider de script Python.
      - name: Instala LibreOffice + bridge Python-UNO + provider de script Python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc python3-uno libreoffice-script-provider-python

      - name: Suíte completa
        run: /usr/bin/python3 tests/run_all.py
